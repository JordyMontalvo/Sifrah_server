name: CI Checks

# Checks de calidad en Pull Requests a master y en pushes a master.
# El DESPLIEGUE lo maneja deploy-do.yml (gated por su propio job de tests).
on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # mock.module / --experimental-test-module-mocks requieren Node >= 20.6.
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
      env:
        CI: true

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Informativo, no bloqueante: reporta vulnerabilidades sin tumbar el check
    # (el codigo depende de paquetes antiguos con advisories conocidos).
    - name: Run security audit
      run: npm audit --audit-level moderate || true

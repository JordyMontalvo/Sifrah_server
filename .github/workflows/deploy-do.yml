# Pipeline de produccion: al hacer push a master se corren los tests y, solo si
# pasan, se despliega a DigitalOcean (wrapper fijo /usr/local/bin/sifrah-deploy
# en el servidor). Requiere los secretos DO_SSH_KEY, DO_KNOWN_HOSTS, DO_HOST, DO_USER.
name: Deploy a DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-digitalocean
  cancel-in-progress: false

jobs:
  # Gate de calidad: el deploy depende de que estos tests pasen.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Correr tests
        run: npm test
        env:
          CI: true

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Preparar llave y host conocido
        env:
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DO_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ejecutar deploy (wrapper fijo en el servidor)
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DO_USER@$DO_HOST" 'sudo /usr/local/bin/sifrah-deploy'

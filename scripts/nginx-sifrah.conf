server {
    server_name api.serve-sifrah.xyz;
    client_max_body_size 200M;

    # No anunciar la version exacta de nginx en cada respuesta.
    server_tokens off;

    # El navegador respeta el tipo declarado y no intenta adivinarlo.
    add_header X-Content-Type-Options "nosniff" always;
    # La API no debe poder incrustarse en un marco de otra web.
    add_header X-Frame-Options "DENY" always;
    # La direccion completa de la peticion no viaja al salir hacia otro sitio.
    add_header Referrer-Policy "no-referrer" always;
    # Este dominio ya redirige el puerto 80 a HTTPS: se le dice al navegador
    # que no vuelva a intentarlo en claro durante un ano.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Sin esto la aplicacion solo veia 127.0.0.1 y el panel de sesiones
        # activas no permitia saber desde donde entro nadie.
        #
        # Se escribe $remote_addr y no $proxy_add_x_forwarded_for a proposito:
        # nginx es el unico proxy delante de la aplicacion, asi que anadir lo
        # que mande el cliente solo permitiria falsificar la direccion.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.serve-sifrah.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.serve-sifrah.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.serve-sifrah.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.serve-sifrah.xyz;
    client_max_body_size 200M;
    server_tokens off;
    return 404; # managed by Certbot
}
